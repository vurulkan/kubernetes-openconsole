apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-openconsole
  namespace: kubernetes-openconsole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-openconsole
  template:
    metadata:
      labels:
        app: kubernetes-openconsole
    spec:
      # OpenConsole never uses the pod's own ServiceAccount: cluster access
      # comes only from the credentials added in Admin → Clusters (stored
      # encrypted in SQLite). So the pod runs without a ServiceAccount token
      # mounted — a compromised container finds no cluster token on disk.
      # The openconsole-reader ServiceAccount in rbac.yaml exists only to
      # mint the token you paste into the UI; it does not need to be the
      # pod's ServiceAccount.
      # serviceAccountName: openconsole-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          # :latest follows every push to main (built by CI). Always pull so a
          # restart (kubectl rollout restart) picks up the newest build. To
          # freeze a version, use a release tag (e.g. 2.12.0) and
          # IfNotPresent — or the images: override in kustomization.yaml.
          image: ghcr.io/vurulkan/kubernetes-openconsole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # ── Persistence ──────────────────────────────────────────────────────
            # DATA_PATH: Path to the SQLite file that holds users, groups, roles,
            # permissions, clusters, audit logs and session_tokens. Default is
            # /data/app.db — must be on a persistent volume if you want anything
            # to survive a pod restart.
            - name: DATA_PATH
              value: /data/app.db

            # STATIC_DIR: Where the compiled React bundle lives inside the image.
            # Only change if you remount a different frontend bundle. Default
            # /app/public matches the Dockerfile layout.
            - name: STATIC_DIR
              value: /app/public

            # TIMEZONE: IANA zone name used when rendering audit log timestamps
            # in the UI. Does not affect how timestamps are stored (UTC in DB).
            # Default UTC.
            - name: TIMEZONE
              value: Europe/Istanbul

            # ── Logging (slog → stdout) ──────────────────────────────────────────
            # LOG_FORMAT: json for log shippers (Filebeat / Fluent-bit / Vector
            # → Elastic / Loki) so each line is a parseable object; text for
            # eyes-on-stdout. Default text.
            - name: LOG_FORMAT
              value: json

            # LOG_LEVEL: debug | info | warn | error. Default info. "debug"
            # includes request bodies and informer sync details — noisy; use
            # briefly for triage, not in steady-state production.
            - name: LOG_LEVEL
              value: info

            # LOG_OUTPUT: stdout | stderr. Default stdout. kubelet captures both
            # equally; the knob exists for sidecar / init-container scenarios.
            - name: LOG_OUTPUT
              value: stdout

            # LOG_ADD_SOURCE: when "true" every log record includes file:line
            # of the slog call site. Useful for triage, costs log volume.
            # Default "false".
            - name: LOG_ADD_SOURCE
              value: "false"

            # LOG_INCLUDE_AUDIT: when "true" every DB audit entry is also
            # mirrored to stdout as msg=audit with event / user / namespace /
            # resource_type / resource_name / request_id / ts. Lets a log
            # pipeline consume audit events without reading the SQLite file.
            # Default "true". Set "false" only if you plan to tail the DB
            # yourself.
            - name: LOG_INCLUDE_AUDIT
              value: "true"

            # ── Audit retention ──────────────────────────────────────────────────
            # LOG_RETENTION_DAYS: how many days of audit rows the backend keeps
            # in SQLite. A background job purges older rows every ~hour. 0 means
            # never purge. Default 30.
            - name: LOG_RETENTION_DAYS
              value: "30"

            # ── Operational guardrails ───────────────────────────────────────────
            # MAX_REPLICAS: upper bound the Scale endpoint accepts for
            # Deployment / StatefulSet scaling, per call. Guards against a slip
            # ("scale to 10000"). Default 100.
            - name: MAX_REPLICAS
              value: "100"

            # ── Pod shell session recording (2.11.0+) ───────────────────────────
            # Every pod exec session is saved as an asciicast v2 file and can be
            # replayed under Admin → Recordings. Recordings hold everything the
            # shell printed — including secrets someone cat'ed — so treat the
            # volume like the audit DB.
            #
            # On/off, retention, size limits and the disk policy are managed in
            # the UI (Admin → Recordings → Recording settings) and stored in the
            # DB — nothing to set here. (The SESSION_RECORDING_* env vars in the
            # README only seed those settings on the very first start.)
            #
            # SESSION_RECORDING_DIR is the one recording setting that lives here,
            # read on every start. Default: /data/recordings, on the same PVC as
            # app.db. To keep recordings on their own volume, uncomment it
            # together with the "recordings" volume + mount below and the
            # second PVC in pvc.yaml.
            # - name: SESSION_RECORDING_DIR
            #   value: /recordings

            # ── Optional labels on every log record ──────────────────────────────
            # APP_ENV: deployment environment label (dev / staging / prod).
            # Shows up as "env=…" on every structured log line — useful for
            # cross-environment Elastic queries. Uncomment to use.
            # - name: APP_ENV
            #   value: prod

            # APP_VERSION: static version label attached to every log line.
            # Handy if you deploy multiple parallel versions (canary, blue /
            # green). Uncomment to use.
            # - name: APP_VERSION
            #   value: "2.12.0"
          resources:
            # Requests cover a quiet steady-state (small cluster, lister cache
            # in the low-MB range). Limits give headroom for informer cache
            # growth on larger clusters (every Pod / Deployment / Service /
            # DaemonSet / StatefulSet / HPA resident in memory). Bump memory
            # first if the pod is OOMKilled under load.
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            # Liveness just confirms the process is accepting requests — DB /
            # cluster state deliberately excluded so a transient DB blip doesn't
            # restart the pod.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Readiness = the SQLite DB is reachable. Clusters are deliberately
            # not part of it: one unreachable cluster must not take the whole
            # console (including the admin screens to fix it) out of service.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # Optional: separate volume for session recordings. Uncomment
            # together with the "recordings" volume below, the second PVC in
            # pvc.yaml, and SESSION_RECORDING_DIR=/recordings above.
            # - name: recordings
            #   mountPath: /recordings
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubernetes-openconsole-data
        # - name: recordings
        #   persistentVolumeClaim:
        #     claimName: kubernetes-openconsole-recordings
