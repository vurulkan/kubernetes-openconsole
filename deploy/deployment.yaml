apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-openconsole
  namespace: kubernetes-openconsole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-openconsole
  template:
    metadata:
      labels:
        app: kubernetes-openconsole
    spec:
      serviceAccountName: openconsole-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/vurulkan/kubernetes-openconsole:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            # ── Persistence ─────────────────────────────────────────────
            - name: DATA_PATH
              value: /data/app.db
            - name: STATIC_DIR
              value: /app/public
            - name: TIMEZONE
              value: Europe/Istanbul
            # ── Logging (ES-ready since 2.9.0) ──────────────────────────
            # JSON format so Filebeat/Fluent-bit can parse each line out of
            # stdout without a grok pattern; audit mirror carries request_id
            # so the audit entry correlates with the HTTP request log.
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
            - name: LOG_OUTPUT
              value: stdout
            - name: LOG_ADD_SOURCE
              value: "false"
            - name: LOG_INCLUDE_AUDIT
              value: "true"
            # ── Audit retention ─────────────────────────────────────────
            - name: LOG_RETENTION_DAYS
              value: "30"
            # ── Deployment / StatefulSet scale cap (per-call guardrail) ─
            - name: MAX_REPLICAS
              value: "100"
          resources:
            # Requests cover a quiet steady-state (small cluster, lister
            # cache in the low-MB range). Limits give headroom for informer
            # cache growth on larger clusters (every Pod/Deployment/Service
            # resident). Bump memory first if OOMKilled under load.
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            # Liveness just confirms the process is accepting requests —
            # DB / cluster state deliberately excluded so a transient DB blip
            # doesn't restart the pod.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Readiness is the fuller check: DB reachable AND (if a cluster
            # is configured) the kube client is ready. Returns 503 otherwise
            # so Kubernetes rolls the pod out of the Service endpoints.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubernetes-openconsole-data
