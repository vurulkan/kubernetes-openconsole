# Throwaway k3d fixtures: pods that fail on purpose (OOM, exit 1 with a sidecar, liveness kill,
# bad image, missing ConfigMap, failing init container, unschedulable, completed job, a chatty
# container that exits every 15 s for log-follow checks), a Deployment whose sidecar comes
# first (log-shipper before web, which logs and shells should default to), a healthy
# Deployment, StatefulSets (healthy + crashing) and a DaemonSet. Never apply to a real cluster.
apiVersion: v1
kind: Namespace
metadata: {name: crashlab}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: healthy, namespace: crashlab}
spec:
  replicas: 2
  selector: {matchLabels: {app: healthy}}
  template:
    metadata: {labels: {app: healthy}}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: [sh, -c, 'while true; do echo tick; sleep 5; done'], resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oom, namespace: crashlab}
spec:
  selector: {matchLabels: {app: oom}}
  template:
    metadata: {labels: {app: oom}}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: [sh, -c, 'echo allocating; tail /dev/zero'], resources: {limits: {memory: 32Mi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: exit1, namespace: crashlab}
spec:
  selector: {matchLabels: {app: exit1}}
  template:
    metadata: {labels: {app: exit1}}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: [sh, -c, 'echo starting; echo "fatal: config missing" >&2; exit 1']}
      - {name: sidecar, image: busybox:1.36, command: [sh, -c, 'while true; do sleep 30; done']}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: flappy, namespace: crashlab}
spec:
  selector: {matchLabels: {app: flappy}}
  template:
    metadata: {labels: {app: flappy}}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: [sh, -c, 'for i in $(seq 1 60); do echo "line $i $(date +%T)"; sleep 0.25; done; exit 1']}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: crashlab}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - {name: log-shipper, image: busybox:1.36, command: [sh, -c, 'while true; do echo shipping; sleep 10; done']}
      - {name: web, image: busybox:1.36, command: [sh, -c, 'while true; do echo serving; sleep 5; done']}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: liveness, namespace: crashlab}
spec:
  selector: {matchLabels: {app: liveness}}
  template:
    metadata: {labels: {app: liveness}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: app
        image: busybox:1.36
        command: [sh, -c, 'trap "" TERM; echo up; while true; do sleep 1; done']
        livenessProbe: {exec: {command: [cat, /nope]}, periodSeconds: 5, failureThreshold: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: badimage, namespace: crashlab}
spec:
  selector: {matchLabels: {app: badimage}}
  template:
    metadata: {labels: {app: badimage}}
    spec:
      containers:
      - {name: app, image: 'busybox:does-not-exist-123'}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: missingcm, namespace: crashlab}
spec:
  selector: {matchLabels: {app: missingcm}}
  template:
    metadata: {labels: {app: missingcm}}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: [sleep, '3600'], envFrom: [{configMapRef: {name: not-there}}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: initfail, namespace: crashlab}
spec:
  selector: {matchLabels: {app: initfail}}
  template:
    metadata: {labels: {app: initfail}}
    spec:
      initContainers:
      - {name: migrate, image: busybox:1.36, command: [sh, -c, 'echo migrating; exit 3']}
      containers:
      - {name: app, image: busybox:1.36, command: [sleep, '3600']}
---
apiVersion: v1
kind: Pod
metadata: {name: unschedulable, namespace: crashlab}
spec:
  nodeSelector: {disk: unicorn}
  containers:
  - {name: app, image: busybox:1.36, command: [sleep, '3600']}
---
apiVersion: batch/v1
kind: Job
metadata: {name: done, namespace: crashlab}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - {name: job, image: busybox:1.36, command: [sh, -c, 'echo done']}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: crashlab}
spec:
  serviceName: db
  replicas: 2
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
      - {name: db, image: busybox:1.36, command: [sh, -c, 'while true; do sleep 5; done'], resources: {limits: {memory: 32Mi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: brokendb, namespace: crashlab}
spec:
  serviceName: brokendb
  replicas: 1
  selector: {matchLabels: {app: brokendb}}
  template:
    metadata: {labels: {app: brokendb}}
    spec:
      containers:
      - {name: db, image: busybox:1.36, command: [sh, -c, 'echo boom; exit 2']}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: agent, namespace: crashlab}
spec:
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      containers:
      - {name: agent, image: busybox:1.36, command: [sh, -c, 'while true; do sleep 5; done']}
