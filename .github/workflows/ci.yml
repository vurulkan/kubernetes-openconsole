name: CI

on:
  push:
    # Every branch but main is built and tested and publishes :dev-latest + :dev-<run>.
    # main only receives release commits whose tree is dev's (already built and tested
    # there); their tag (v2.14.2 …) runs once and publishes :2.14.2 and :latest. A push to
    # main alone runs nothing: push the commit and its tag together.
    branches: ["**", "!main"]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege: every job reads the repo only; publish asks for its own
# extra permissions below. Third-party actions are pinned by commit SHA (the
# comment names the release); bump SHA and comment together.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Scans only warn (the build goes on); an agent that sees the warning
      # tells the maintainer and asks before fixing (CLAUDE.md).
      - name: npm audit (runtime dependencies, warning only)
        run: npm audit --omit=dev --audit-level=high || echo "::warning title=npm audit::high or critical advisories in runtime dependencies, see the step log"
      # vite build does not type-check; this does.
      - run: npx tsc --noEmit -p .
      # React hooks rules (eslint.config.js).
      - run: npm run lint
      # Unit + component tests, i18n parity, axe accessibility checks.
      - run: npm test
      - run: npm run build

  backend:
    name: Backend build + vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod's toolchain line (the same Go as the Dockerfile).
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # Unused code, deprecated calls, common bugs (fails the build).
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck (warning only)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || echo "::warning title=govulncheck::reachable vulnerabilities, see the step log"
      # The docs site's reference pages are generated from the code: a change
      # to env vars, permissions, audit actions, metrics, ClusterRole rules or
      # shortcuts must come with `go run ./cmd/docgen` (backend/cmd/docgen).
      - name: Generated docs are current
        run: |
          go run ./cmd/docgen
          git add -N ../docs/reference
          git diff --exit-code -- ../docs/reference || { echo "::error::docs/reference is out of date: run 'cd backend && go run ./cmd/docgen' and commit"; exit 1; }

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both architectures, so an arm64 break shows up on the PR, not at release.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kubernetes-openconsole:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The amd64 image again (from the cache) into the local daemon, for Trivy.
      - name: Load amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kubernetes-openconsole:scan
          cache-from: type=gha
      - name: Trivy image scan (warning only)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubernetes-openconsole:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: steps.trivy.outcome == 'failure'
        run: echo "::warning title=Trivy::HIGH / CRITICAL findings with a fix in the image, see the Trivy step log"

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [docker]
    # Release tags publish :X.Y.Z + :latest from one build, so :latest is
    # always the newest release (same digest as :X.Y.Z). Other branches publish
    # :dev-<run> + :dev-latest for testing before merge; :latest never moves to
    # a dev build. Pushes to main don't run this workflow (see `on`).
    # CI is the only publisher of image tags. Fork PRs never publish (no push).
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref != 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      # Signed build provenance + SBOM via GitHub artifact attestations
      # (Sigstore, keyless). They are stored on GitHub, not as extra tags in
      # the registry.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No emulation needed: the Go and npm stages cross-compile on the
      # runner and the distroless runtime stage only copies files.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/kubernetes-openconsole"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"; MOVING=latest
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"; MOVING=dev-latest
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tags<<EOF\n%s:%s\n%s:%s\nEOF\n' "$IMG" "$VERSION" "$IMG" "$MOVING" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          # No in-registry attestation manifests; provenance and SBOM are
          # attested on GitHub below.
          provenance: false
          cache-from: type=gha
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.tags.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      # actions/attest: without sbom-path it attests SLSA build provenance,
      # with it the SBOM (replaces attest-build-provenance / attest-sbom).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: false
