name: CI

on:
  push:
    branches: [main, "1.*"]
    # Release tags (v2.14.2 …) publish :2.14.2 and :latest.
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # vite build does not type-check; this does.
      - run: npx tsc --noEmit -p .
      # Unit + component tests, i18n parity, axe accessibility checks.
      - run: npm test
      - run: npm run build

  backend:
    name: Backend build + vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Both architectures, so an arm64 break shows up on the PR, not at release.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kubernetes-openconsole:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [docker]
    # Only release tags publish, and one build gets both tags, so :latest is
    # always the newest release (same digest as :X.Y.Z). Pushes to main are
    # built and tested by the jobs above but never published. CI is the only
    # publisher of image tags.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      # Signed build provenance + SBOM via GitHub artifact attestations
      # (Sigstore, keyless). They are stored on GitHub, not as extra tags in
      # the registry.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Only the runtime stage (apk add) runs under emulation for arm64; the
      # Go and npm stages cross-compile on the runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: tags
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/kubernetes-openconsole"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "$IMG" "${GITHUB_REF_NAME#v}" "$IMG" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # No in-registry attestation manifests; provenance and SBOM are
          # attested on GitHub below.
          provenance: false
          cache-from: type=gha
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tags.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: false
