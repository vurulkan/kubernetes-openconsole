name: Feature request
description: Propose a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that OpenConsole doesn't let you do today? Who needs it (users, admins, operators)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Mention the permission and audit side if it changes what someone can do.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other ways you considered.
