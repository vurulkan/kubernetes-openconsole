# Minimal Prometheus scraping kubelet cAdvisor, for the Prometheus settings ("in the cluster" mode:
# monitoring / prometheus-server / 9090). Throwaway k3d clusters only.
apiVersion: v1
kind: Namespace
metadata: {name: monitoring}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: smoke-prometheus}
rules:
- {apiGroups: [""], resources: [nodes, nodes/proxy, nodes/metrics], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: smoke-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: smoke-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: monitoring}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s}
    scrape_configs:
    - job_name: kubelet
      scheme: https
      metrics_path: /metrics/cadvisor
      tls_config: {insecure_skip_verify: true}
      authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
      kubernetes_sd_configs: [{role: node}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: monitoring}
spec:
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.2
        args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2d]
        ports: [{containerPort: 9090, name: web}]
        volumeMounts: [{name: cfg, mountPath: /etc/prometheus}]
      volumes: [{name: cfg, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus-server, namespace: monitoring, labels: {app.kubernetes.io/name: prometheus}}
spec:
  selector: {app: prometheus}
  ports: [{name: web, port: 9090, targetPort: 9090}]
