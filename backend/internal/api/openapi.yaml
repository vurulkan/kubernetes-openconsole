# OpenConsole API, hand-written (M16). Served as JSON at GET /api/openapi.json without sign-in:
# keep it free of hostnames, user names and secrets. openapi_test.go checks that every /api and
# /ws route in router.go is here (and nothing else), one tag each, and that permissions exist.
#
# Extensions the in-app documentation (API keys → Documentation) reads:
#   x-openconsole-permission: [resource:action, …]  all of them are needed, in the namespace of the path
#                                                    ("*:edit" = edit on the resource in the path)
#   x-openconsole-admin: true                        admin only; with an API key, only one with the Admin API scope
#   x-openconsole-api-key: false                     web session only (an API key gets 403 api_key_not_allowed)
openapi: 3.1.0
info:
  title: OpenConsole API
  version: "2.22"
  description: |
    Kubernetes workloads across several clusters, limited to what your roles allow; every action is audited.

    **Sign in with an API key:** `Authorization: Bearer oc_…` (create one under your account → API keys).
    A key can do at most what its owner can, as far as the admin's API access policy lets keys go, and only
    what the key itself was given. `GET /api/auth/me` shows who you are and what the key reaches.

    **Cluster:** `X-OpenConsole-Cluster: <name or id>` on each request; without it, the owner's selected cluster.

    **WebSockets** (`/ws/…`, live logs, shell, events): first `POST /api/ws-ticket` with `{"path": "/ws/…"}`,
    then connect to that path with `?ticket=<ticket>` (single use, short-lived). For one command or a log
    snapshot, use the plain HTTP endpoints instead: `POST …/pods/{name}/exec`, `GET …/pods/{name}/logs`.

    **Errors** have a JSON body `{"error": "<reason>"}`:
    - `401`: the key (or session) is not valid: unknown, expired or revoked.
    - `403`: the key is valid but may not do this. Reasons: `forbidden` (no permission here),
      `api_access_policy` (the owner has it, the admin's policy keeps it from keys), `api_access_off`
      (the policy turns API access off for this user), `api_key_not_allowed` (web session only),
      `feature_disabled` (switched off by the operator), `admin_only`.
    - `429`: too many requests (10 per second per key, bursts of 30) or too many open shells / log streams.

    Every action and every resource read made with a key is written to the audit log with the key's name;
    helper calls such as `/api/auth/me` and `/api/ws-ticket` are not.
servers:
  - url: /
security:
  - apiKey: []
tags:
  - {name: Account, description: "Who you are, clusters, namespaces, your permissions, WebSocket tickets."}
  - {name: Workloads, description: "Deployments, StatefulSets, DaemonSets, HPAs, Jobs, CronJobs."}
  - {name: Pods, description: "Pods, their events, restart history and resource usage."}
  - {name: Logs, description: "Pod logs as text, or followed live over a WebSocket."}
  - {name: Exec, description: "Run one command in a container, or open an interactive shell. Always recorded."}
  - {name: Config, description: "Services, ingresses, ConfigMaps and Secrets."}
  - {name: Events, description: "Live Kubernetes events over a WebSocket."}
  - {name: Admin, description: "Users, roles, clusters, audit log, recordings. Admin only."}

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: An API key (`oc_…`) or a web session token.
  parameters:
    namespace: {name: namespace, in: path, required: true, schema: {type: string}, example: default}
    name: {name: name, in: path, required: true, schema: {type: string}}
    id: {name: id, in: path, required: true, schema: {type: integer}}
    cluster:
      name: X-OpenConsole-Cluster
      in: header
      required: false
      schema: {type: string}
      description: Cluster name or id (API keys only); defaults to your selected cluster.
    ticket: {name: ticket, in: query, required: true, schema: {type: string}, description: From POST /api/ws-ticket.}
    container: {name: container, in: query, schema: {type: string}, description: Container name; defaults to the pod's default container.}
  responses:
    list:
      description: A Kubernetes list.
      content:
        application/json:
          schema: {type: object, properties: {items: {type: array, items: {type: object}}}}
    object:
      description: The Kubernetes object as JSON.
      content: {application/json: {schema: {type: object}}}
    yaml:
      description: The object as YAML (managed fields removed).
      content:
        application/json:
          schema: {type: object, properties: {yaml: {type: string}}}
          example: {yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: web-7c9f\n…"}
    ok:
      description: Done.
      content: {application/json: {schema: {type: object}}}
    websocket:
      description: Switching protocols (WebSocket). Connect with ?ticket= from POST /api/ws-ticket.
    error:
      description: Error with a reason.
      content:
        application/json:
          schema: {type: object, properties: {error: {type: string}}}
          example: {error: forbidden}

paths:
  # ─── Account ────────────────────────────────────────────────────────────────
  /api/openapi.json:
    get:
      tags: [Account]
      summary: This API description
      security: []
      responses: {"200": {description: OpenAPI 3.1 document.}}
  /api/auth/login:
    post:
      tags: [Account]
      summary: Sign in with a user name and password (web)
      security: []
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/auth/providers:
    get:
      tags: [Account]
      summary: Sign-in methods offered on the login page
      security: []
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/auth/azure/start:
    get:
      tags: [Account]
      summary: Start an Azure AD sign-in (web)
      security: []
      x-openconsole-api-key: false
      responses: {"302": {description: Redirect to Azure AD.}}
  /api/auth/azure/callback:
    get:
      tags: [Account]
      summary: Azure AD sign-in callback (web)
      security: []
      x-openconsole-api-key: false
      responses: {"302": {description: Redirect to the app.}}
  /api/auth/me:
    get:
      tags: [Account]
      summary: Who you are, and what your API key reaches
      description: Call this first. With a key, `apiKey` describes the key (never its secret) and `permissions` are what the key reaches now.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              example:
                user: {id: 7, username: jdoe, isAdmin: false, isActive: true}
                apiKey: {id: 3, name: claude-dev, prefix: oc_ab12cd, clusters: [0], allNamespaces: false, namespaces: [ci-dev], grants: ["pods:list", "pods:get", "pods:logs"], expiresAt: "2026-12-12T00:00:00Z"}
                namespaces: [ci-dev]
                permissions: [{clusterId: 0, namespace: ci-dev, resource: pods, action: list}]
  /api/auth/change-password:
    post:
      tags: [Account]
      summary: Change your password (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/customization/logo:
    get:
      tags: [Account]
      summary: The custom logo, if one was uploaded
      security: []
      responses: {"200": {description: An image.}, "404": {description: No custom logo.}}
  /api/cluster/active:
    get:
      tags: [Account]
      summary: The cluster your requests go to
      responses:
        "200":
          description: The cluster.
          content: {application/json: {example: {active: {id: 1, name: nonprod, description: '', isDefault: true}}}}
  /api/cluster/select:
    post:
      tags: [Account]
      summary: Switch your selected cluster (web; keys send X-OpenConsole-Cluster)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/clusters/public:
    get:
      tags: [Account]
      summary: Clusters you can use
      responses:
        "200":
          description: Clusters.
          content: {application/json: {example: {items: [{id: 1, name: nonprod, isActive: true, selected: true}]}}}
  /api/features:
    get:
      tags: [Account]
      summary: Feature flags the operator set (pod_exec, secrets, …)
      responses:
        "200":
          description: Flags.
          content: {application/json: {example: {features: {pod_exec: true, yaml_edit: true, workload_actions: true, secrets: true, secret_reveal: true, secret_edit: true, api_keys: true}}}}
  /api/version:
    get:
      tags: [Account]
      summary: Server version
      responses:
        "200":
          description: Version.
          content: {application/json: {example: {version: "2.22.0"}}}
  /api/ws-ticket:
    post:
      tags: [Account]
      summary: A single-use ticket for one WebSocket path
      requestBody:
        content: {application/json: {example: {path: /ws/namespaces/ci-dev/pods/web-7c9f/logs}}}
      responses:
        "200":
          description: Use as ?ticket= on that path, once, within a minute.
          content: {application/json: {example: {ticket: 9f2c…}}}
  /api/namespaces:
    get:
      tags: [Account]
      summary: Namespaces you can see on this cluster
      parameters: [{$ref: '#/components/parameters/cluster'}]
      responses:
        "200":
          description: Namespace names.
          content: {application/json: {example: {namespaces: [ci-dev, ci-test]}}}
  /api/namespaces/{namespace}/permissions:
    parameters: [{$ref: '#/components/parameters/namespace'}]
    get:
      tags: [Account]
      summary: What you may do in a namespace (resource → actions)
      responses:
        "200":
          description: Allowed actions, feature flags applied.
          content: {application/json: {example: {resources: {pods: [list, get, logs], deployments: [list, get]}}}}
        "403": {$ref: '#/components/responses/error'}
  /api/views:
    get:
      tags: [Account]
      summary: Your saved Dashboard views
      responses: {"200": {$ref: '#/components/responses/list'}}
    post:
      tags: [Account]
      summary: Save a Dashboard view (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/views/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    put:
      tags: [Account]
      summary: Share or unshare a saved view (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
    delete:
      tags: [Account]
      summary: Delete a saved view (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/me/api-keys:
    get:
      tags: [Account]
      summary: Your API keys (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/list'}}
    post:
      tags: [Account]
      summary: Create an API key (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/me/api-keys/ceiling:
    get:
      tags: [Account]
      summary: What a key of yours may be given (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/me/api-keys/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    put:
      tags: [Account]
      summary: Edit an API key (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
    delete:
      tags: [Account]
      summary: Delete an API key (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/me/api-keys/{id}/regenerate:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [Account]
      summary: New secret and expiry for an API key (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/me/api-keys/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      tags: [Account]
      summary: Revoke an API key (web)
      x-openconsole-api-key: false
      responses: {"200": {$ref: '#/components/responses/ok'}}

  # ─── Pods ───────────────────────────────────────────────────────────────────
  /api/namespaces/{namespace}/pods:
    parameters: [{$ref: '#/components/parameters/namespace'}]
    get:
      tags: [Pods]
      summary: List pods
      x-openconsole-permission: ["pods:list"]
      responses:
        "200":
          description: Kubernetes Pods (core/v1).
          content:
            application/json:
              example:
                items:
                  - metadata: {name: web-7c9f, namespace: ci-dev, labels: {app: web}}
                    spec: {nodeName: node-1, containers: [{name: app, image: "nginx:1.27"}]}
                    status: {phase: Running, containerStatuses: [{name: app, ready: false, restartCount: 12, state: {waiting: {reason: CrashLoopBackOff}}, lastState: {terminated: {exitCode: 1, reason: Error}}}]}
  /api/namespaces/{namespace}/pods/{name}:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Pods]
      summary: One pod
      x-openconsole-permission: ["pods:get"]
      responses: {"200": {$ref: '#/components/responses/object'}, "404": {description: No such pod.}}
  /api/namespaces/{namespace}/pods/{name}/yaml:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Pods]
      summary: A pod as YAML
      x-openconsole-permission: ["pods:get"]
      responses: {"200": {$ref: '#/components/responses/yaml'}}
  /api/namespaces/{namespace}/pods/{name}/events:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Pods]
      summary: Kubernetes events of a pod
      x-openconsole-permission: ["pods:get"]
      responses:
        "200":
          description: Kubernetes Events (core/v1).
          content:
            application/json:
              example: {items: [{type: Warning, reason: BackOff, message: "Back-off restarting failed container app", count: 41, lastTimestamp: "2026-11-12T09:14:03Z"}]}
  /api/namespaces/{namespace}/pods/{name}/restarts:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Pods]
      summary: Restart history of a pod (container exits, exit codes)
      x-openconsole-permission: ["pods:get"]
      responses:
        "200":
          description: Container terminations, newest first.
          content:
            application/json:
              example: {items: [{pod: web-7c9f, container: app, exitCode: 137, reason: OOMKilled, finishedAt: "2026-11-12T09:10:00Z"}]}
  /api/namespaces/{namespace}/metrics/pods:
    parameters: [{$ref: '#/components/parameters/namespace'}]
    get:
      tags: [Pods]
      summary: CPU and memory of the namespace's pods now (metrics-server)
      x-openconsole-permission: ["pods:list"]
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/namespaces/{namespace}/metrics/pods/{name}:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Pods]
      summary: CPU and memory history of a pod
      x-openconsole-permission: ["pods:list"]
      responses: {"200": {$ref: '#/components/responses/ok'}}

  # ─── Logs ───────────────────────────────────────────────────────────────────
  /api/namespaces/{namespace}/pods/{name}/logs:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Logs]
      summary: The end of a pod's log, as text
      description: |
        Not followed: returns what is there now. At most 10 000 lines and 5 MiB; a cut log
        has the header `X-OpenConsole-Truncated: true` (cut at a line end). To follow a log live,
        use the WebSocket below. Audited as `pod.logs`.
      x-openconsole-permission: ["pods:logs"]
      parameters:
        - {$ref: '#/components/parameters/container'}
        - {name: tailLines, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 500}}
        - {name: sinceSeconds, in: query, schema: {type: integer, minimum: 1}, description: Only lines newer than this.}
        - {name: previous, in: query, schema: {type: boolean}, description: The previous (crashed) instance of the container.}
        - {name: timestamps, in: query, schema: {type: boolean}, description: Prefix each line with an RFC 3339 time.}
      responses:
        "200":
          description: Log lines.
          headers:
            X-OpenConsole-Truncated: {schema: {type: string}, description: '"true" when the 5 MiB limit cut the log.'}
          content:
            text/plain:
              example: "2026-11-12 09:13:58 starting server\npanic: connect to db: connection refused\n"
        "400": {description: "Bad parameter, or `container_not_found` / `previous_unavailable` / `not_ready`.", content: {application/json: {example: {error: previous_unavailable}}}}
        "404": {description: "`pod_not_found`", content: {application/json: {example: {error: pod_not_found}}}}
        "429": {description: "`rate_limited`: too many log requests at once."}
  /ws/namespaces/{namespace}/pods/{name}/logs:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}, {$ref: '#/components/parameters/ticket'}]
    get:
      tags: [Logs]
      summary: Follow a pod's log live (WebSocket, JSON frames)
      description: |
        Frames: `{"t":"line","ts":"…","c":"app","text":"…"}`, then `{"t":"end","reason":"…","retry":bool}`
        or `{"t":"error","reason":"…"}`. Query: `container`, `tail` (default 100), `previous=true`.
      x-openconsole-permission: ["pods:logs"]
      responses: {"101": {$ref: '#/components/responses/websocket'}}
  /ws/namespaces/{namespace}/deployments/{name}/logs:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}, {$ref: '#/components/parameters/ticket'}]
    get:
      tags: [Logs]
      summary: Follow every pod and container of a Deployment (WebSocket)
      x-openconsole-permission: ["deployments:get", "pods:logs"]
      responses: {"101": {$ref: '#/components/responses/websocket'}}
  /ws/namespaces/{namespace}/jobs/{name}/logs:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}, {$ref: '#/components/parameters/ticket'}]
    get:
      tags: [Logs]
      summary: Follow every pod of a Job (WebSocket)
      x-openconsole-permission: ["jobs:get", "pods:logs"]
      responses: {"101": {$ref: '#/components/responses/websocket'}}

  # ─── Exec ───────────────────────────────────────────────────────────────────
  /api/namespaces/{namespace}/pods/{name}/exec:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    post:
      tags: [Exec]
      summary: Run one command in a container
      description: |
        `command` is an argv array and is not run in a shell (for pipes, pass `["sh", "-c", "…"]`).
        No stdin. Output is kept up to 1 MiB per stream; the rest is dropped and `truncated` is true,
        but the command runs to its end. `timeoutSeconds` 1–120 (default 30): past it the output so far
        comes back with `exitCode: -1` and `truncated: true` (Kubernetes does not stop the process; it
        may run on in the container). A non-zero exit code is a normal answer (200).
        Output is text: bytes that are not UTF-8 come back as U+FFFD, so pipe binary output through `base64`.
        Recorded like a shell (Admin → Recordings, "command"); the audit log keeps the program name
        (`command[0]`), never the whole command line.
      x-openconsole-permission: ["pods:exec"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: {type: array, items: {type: string}, minItems: 1}
                container: {type: string}
                timeoutSeconds: {type: integer, minimum: 1, maximum: 120, default: 30}
            example: {container: app, command: [cat, /etc/os-release], timeoutSeconds: 30}
      responses:
        "200":
          description: The command ran (whatever its exit code).
          content:
            application/json:
              example: {stdout: "NAME=\"Alpine Linux\"\nID=alpine\n", stderr: "", exitCode: 0, truncated: false, durationMs: 184}
        "400": {description: "Bad body, `container_not_found` or `not_ready` (the container is not running).", content: {application/json: {example: {error: container_not_found}}}}
        "403": {description: "`forbidden`, `api_access_policy` or `feature_disabled`.", content: {application/json: {example: {error: api_access_policy}}}}
        "404": {description: "`pod_not_found`"}
        "429": {description: "`too_many_sessions`: your shells and commands at once are over the limit."}
        "503": {description: "`recording_unavailable`: a command run with an API key is always recorded, and recording failed."}
  /ws/namespaces/{namespace}/pods/{name}/exec:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}, {$ref: '#/components/parameters/ticket'}]
    get:
      tags: [Exec]
      summary: Interactive shell (WebSocket, TTY)
      description: |
        Binary frames are stdin / stdout; text frame `{"type":"resize","cols":120,"rows":40}`.
        Query `container`, `command` (default: the first of bash, ash, sh). Recorded.
      x-openconsole-permission: ["pods:exec"]
      responses: {"101": {$ref: '#/components/responses/websocket'}}

  # ─── Events ─────────────────────────────────────────────────────────────────
  /ws/events:
    parameters: [{$ref: '#/components/parameters/ticket'}]
    get:
      tags: [Events]
      summary: Live Kubernetes events and object changes (WebSocket)
      description: Query `namespace` to filter; only namespaces you can see.
      responses: {"101": {$ref: '#/components/responses/websocket'}}

  # ─── Workloads ──────────────────────────────────────────────────────────────
  /api/namespaces/{namespace}/deployments:
    parameters: [{$ref: '#/components/parameters/namespace'}]
    get:
      tags: [Workloads]
      summary: List Deployments
      x-openconsole-permission: ["deployments:list"]
      responses:
        "200":
          description: Kubernetes Deployments (apps/v1).
          content:
            application/json:
              example: {items: [{metadata: {name: web, namespace: ci-dev}, spec: {replicas: 2}, status: {replicas: 2, readyReplicas: 1, unavailableReplicas: 1}}]}
  /api/namespaces/{namespace}/deployments/{name}:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Workloads]
      summary: One Deployment
      x-openconsole-permission: ["deployments:get"]
      responses: {"200": {$ref: '#/components/responses/object'}}
  /api/namespaces/{namespace}/deployments/{name}/yaml:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Workloads]
      summary: A Deployment as YAML
      x-openconsole-permission: ["deployments:get"]
      responses: {"200": {$ref: '#/components/responses/yaml'}}
  /api/namespaces/{namespace}/deployments/{name}/replicasets:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Workloads]
      summary: Revisions of a Deployment (its ReplicaSets)
      x-openconsole-permission: ["deployments:get"]
      responses:
        "200":
          description: Revisions, newest first.
          content: {application/json: {example: {items: [{name: web-7c9f, revision: "4", podTemplateHash: 7c9f, images: ["nginx:1.27"], replicas: 2, readyReplicas: 1, createdAt: "2026-11-10T08:00:00Z"}]}}}
  /api/namespaces/{namespace}/deployments/{name}/events:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Workloads]
      summary: Kubernetes events of a Deployment (its pods' events are on the pods)
      x-openconsole-permission: ["deployments:get"]
      responses: {"200": {$ref: '#/components/responses/list'}}
  /api/namespaces/{namespace}/deployments/{name}/restarts:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Workloads]
      summary: Restart history of a Deployment's pods, deleted pods included
      x-openconsole-permission: ["deployments:get"]
      responses: {"200": {$ref: '#/components/responses/list'}}
  /api/namespaces/{namespace}/metrics/deployments/{name}:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    get:
      tags: [Workloads]
      summary: CPU and memory history of a Deployment
      x-openconsole-permission: ["deployments:get"]
      responses: {"200": {$ref: '#/components/responses/ok'}}
  /api/namespaces/{namespace}/deployments/{name}/restart:
    parameters: [{$ref: '#/components/parameters/namespace'}, {$ref: '#/components/parameters/name'}]
    post:
      tags: [Workloads]
      summary: Rolling restart of a Deployment
